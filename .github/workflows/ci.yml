# CI (B-13): every push and pull request runs the test suite with no model key (Setup Guide section 07).
# Two jobs:
#   test          pytest over tests/ - all tests use fakes for the provider, embedder and NLI model.
#   smoke-no-key  the real pipeline over the four sample tickets with the provider disconnected
#                 (no key, empty reply cache): every ticket must escalate with a reason, nothing may
#                 crash, and the decision log must reconcile (A9, A11, A8). Downloads the two small
#                 local models (cached between runs).
# The pinned stack pulls torch through sentence-transformers; the CPU wheel index keeps the
# install at a fraction of the default CUDA build.
name: CI

on: [push, pull_request]

env:
  ANONYMIZED_TELEMETRY: "False"     # chromadb telemetry off
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  smoke-no-key:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('requirements.txt') }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - name: Harness with the provider disconnected
        env:
          OPENROUTER_API_KEY: ""
          LLM_CACHE_DIR: ${{ runner.temp }}/empty_cache
        run: python -m evaluation.harness --input tests/fixtures/sample_tickets.json --output ${{ runner.temp }}/nokey
      - name: Every ticket escalated with a reason, log reconciled
        run: |
          python - <<'EOF'
          import json, os
          out = os.path.join(os.environ["RUNNER_TEMP"], "nokey")
          m = json.load(open(os.path.join(out, "metrics.json")))
          rows = [json.loads(l) for l in open(os.path.join(out, "results.jsonl"))]
          assert m["volume"]["processed"] == 4 == len(rows), m["volume"]
          assert all(r["action"] == "escalate" and r["error"] for r in rows), rows
          assert m["governance"]["decision_log"]["complete"], m["governance"]
          print("disconnected run:", m["volume"], "| log rows", m["governance"]["decision_log"]["rows_total"])
          EOF
