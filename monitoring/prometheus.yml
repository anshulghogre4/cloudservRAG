# Prometheus scrape configuration (Setup Guide section 06).
# Run the API with `python -m src.api`; metrics are served on METRICS_PORT (default 8001) and at
# GET /metrics on the API port. Start Prometheus with: prometheus --config.file=monitoring/prometheus.yml
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "support-system"
    static_configs:
      - targets: ["localhost:8001"]
