# Local monitoring stack (B-12): Prometheus scraping the API's metrics port, Grafana with the
# dashboard provisioned. The API itself runs on the host (`python -m src.api`), so Prometheus
# reaches it through host.docker.internal:8001.
#
#   docker compose -f monitoring/docker-compose.yml up -d
#   Grafana:    http://localhost:3000  (admin / admin)  -> dashboard "CloudServe support pipeline"
#   Prometheus: http://localhost:9090
#   docker compose -f monitoring/docker-compose.yml down
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana_dashboard.json:/var/lib/grafana/dashboards/cloudserve.json:ro
    depends_on: [prometheus]
